<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Directory – Abuja Chamber of Commerce</title>
  <meta name="description" content="Browse the full member directory of the Abuja Chamber of Commerce. Find local businesses, contact details, and membership levels across Abuja, FCT." />
  <meta name="author" content="Vimagh Solomon" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Member Directory – Abuja Chamber of Commerce" />
  <meta property="og:description" content="Browse the full member directory of the Abuja Chamber of Commerce. Find local businesses, contact details, and membership levels across Abuja, FCT." />
  <meta property="og:image" content="https://vimagh.github.io/wdd231/chamber/images/og-chamber.jpg" />

  <link rel="icon" href="favicon.svg" type="images/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="scripts/chamber.js" defer></script>

<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-inner">
      <div class="brand">
        <!-- SVG Favicon / Logo -->
        <svg class="site-logo" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" aria-label="Abuja Chamber of Commerce logo">
          <rect width="44" height="44" rx="10" fill="#C8A951"/>
          <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
                fill="#004d2c" font-family="Playfair Display, Georgia, serif"
                font-size="24" font-weight="700">A</text>
        </svg>
        <span class="site-name">Abuja Chamber<br>of Commerce</span>
      </div>

      <!-- Theme toggle -->
      <button class="theme-toggle" aria-label="Toggle dark mode" id="theme-btn">◑</button>

      <!-- Hamburger -->
      <button id="menu-btn" class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <!-- Navigation -->
      <nav id="main-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="directory.html" class="active" aria-current="page">Directory</a></li>
          <li><a href="join.html">Join</a></li>
          <li><a href="discover.html">Discover</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main>
    <div class="directory-controls">
      <h1>Member Directory</h1>
      <div class="view-btns" role="group" aria-label="Toggle view">
        <button class="view-btn active" id="btn-grid" aria-label="Grid view" title="Grid view">⊞</button>
        <button class="view-btn" id="btn-list" aria-label="List view" title="List view">☰</button>
      </div>
    </div>

    <!-- Members Container -->
    <div id="member-container" aria-live="polite" aria-label="Chamber members"></div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="footer-inner">

      <!-- Contact Info -->
      <div class="footer-contact">
        <strong>Abuja Chamber of Commerce</strong>
        <p>
          10 Constitution Avenue<br>
          Central Business District<br>
          Abuja, FCT 900211<br>
          info@abujachamber.org<br>
          (234) 700-123-4567
        </p>
      </div>

      <!-- Social Icons -->
      <div class="footer-middle">
        <div class="footer-social" aria-label="Social media links">
          <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
